<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Ctext%20y%3D'13'%20font-size%3D'13'%3E%F0%9F%93%96%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<header id="topbar">
  <button id="menu-btn" class="icon-btn" type="button" aria-label="切换目录">☰</button>
  <a id="site-name" class="site-name" href="#/"></a>
  <div class="topbar-right">
    <button id="toc-toggle" class="pill-btn" type="button" aria-label="本页大纲">大纲</button>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="切换主题">🌙</button>
  </div>
</header>

<div id="layout">
  <nav id="sidebar" aria-label="文档目录"><div class="sidebar-nav"></div></nav>
  <main id="main"><article class="markdown-section" id="content"></article></main>
  <aside id="toc" aria-label="本页大纲"></aside>
</div>

<div id="overlay" hidden></div>
<div id="lightbox" hidden>
  <img alt="">
  <button type="button" class="lightbox-close" aria-label="关闭">×</button>
</div>

<!-- 外壳零配置：内容根默认 docs/，项目自己的配置都在 docs/_config.json 里（说明见 docs/指南/站点配置.md）。
     只有换内容根时才需要解开下面这行——测试夹具就是靠它把 root 指到别处：
     <script>window.MD_SITE = { root: 'fixtures' };</script> -->
<script type="module" src="app/main.js"></script>
</body>
</html>
